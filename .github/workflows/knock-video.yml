# Runs tools/knock_video.py with the REPLICATE_API_TOKEN repository secret (the token never leaves
# GitHub) and pushes the clips, the ledger and the log to the knock-clips branch.
name: knock-video
on:
  workflow_dispatch:
    inputs:
      args:
        description: 'arguments for tools/knock_video.py, e.g. "schema google/veo-3.1" or "run <model> <start> <end> A"'
        required: true
permissions:
  contents: write
concurrency: knock-video
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Bring in earlier clips and the ledger
        run: |
          git fetch origin knock-clips && git checkout origin/knock-clips -- tools/out || mkdir -p tools/out
      - name: Run
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          ARGS: ${{ inputs.args }}
        run: |
          mkdir -p tools/out
          echo "\$ knock_video.py $ARGS" >> tools/out/knock_log.txt
          python3 tools/knock_video.py $ARGS 2>&1 | tee -a tools/out/knock_log.txt
      - name: Push results to knock-clips
        if: always()
        run: |
          git config user.name knock-video && git config user.email knock-video@users.noreply.github.com
          mv tools/out /tmp/out && git checkout --orphan knock-clips-new && git rm -rfq . && mkdir -p tools && mv /tmp/out tools/out
          git add -f tools/out && git commit -qm "knock-video: $ARGS" && git push -f origin HEAD:knock-clips
        env:
          ARGS: ${{ inputs.args }}
